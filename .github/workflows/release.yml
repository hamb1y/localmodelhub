name: Test and release

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions: {}

jobs:
  terminal:
    name: Terminal (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - arch: aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    env:
      RUST_TARGET: ${{ matrix.target }}
      CC: musl-gcc
      RUSTFLAGS: "-C linker=musl-gcc"
      LMH_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Prepare native Rust toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y musl-tools
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy --target "$RUST_TARGET"
      - name: Verify and build the terminal application
        working-directory: terminal
        run: |
          cargo +stable fmt --check
          cargo +stable clippy --locked --target "$RUST_TARGET" --all-targets -- -D warnings
          cargo +stable test --locked --target "$RUST_TARGET"
          cargo +stable build --locked --target "$RUST_TARGET" --release
          install -D -m 0755 "target/$RUST_TARGET/release/lmh" "../terminal-bins/lmh-$LMH_ARCH"
          "../terminal-bins/lmh-$LMH_ARCH" --help
          if readelf -l "../terminal-bins/lmh-$LMH_ARCH" | grep -q 'INTERP'; then
            echo "The published terminal must not require a dynamic loader." >&2
            exit 1
          fi
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: terminal-${{ matrix.arch }}
          path: terminal-bins/lmh-${{ matrix.arch }}
          if-no-files-found: error

  build:
    needs: terminal
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.3'
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: terminal-*
          merge-multiple: true
          path: terminal-bins
      - name: Test Python and shell syntax
        run: |
          python3 -m venv .venv
          .venv/bin/pip install .
          .venv/bin/python -m unittest discover -s tests -v
          for script in install.sh deploy/*.sh; do bash -n "$script"; done
      - name: Build and test the static panel
        run: |
          bash deploy/build-release.sh --build-ui --terminal-dir terminal-bins
          cd web
          npm run check
          bun x --no-install playwright-core install --with-deps chromium
          bun test
      - name: Check release tag and checksum
        if: github.ref_type == 'tag'
        run: |
          version="$(python3 -c "import tomllib; from lmh import __version__; assert __version__ == tomllib.load(open('pyproject.toml', 'rb'))['project']['version'] == tomllib.load(open('terminal/Cargo.toml', 'rb'))['package']['version']; print(__version__)")"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ && "$GITHUB_REF_NAME" == "v$version" ]]
          cd dist
          sha256sum localmodelhub.tar.gz > localmodelhub.tar.gz.sha256
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: github.ref_type == 'tag'
        with:
          name: release-linux
          path: |
            dist/localmodelhub.tar.gz
            dist/localmodelhub.tar.gz.sha256
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag' && github.repository == 'hamb1y/localmodelhub'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-linux
          path: release
      - name: Publish GitHub release
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          sha256sum --strict --check localmodelhub.tar.gz.sha256
          gh release create "$GITHUB_REF_NAME" localmodelhub.tar.gz localmodelhub.tar.gz.sha256 \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --latest
