[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "localmodelhub"
version = "0.1.0"
description = "Manage local model catalogs and inference runtimes."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "huggingface_hub",
    "blake3",
    "textual",
]

[project.scripts]
lmh = "lmh.cli:main"
lmh-server = "lmh.server:main"

[project.urls]
Homepage = "https://github.com/hamb1y/localmodelhub"
Issues = "https://github.com/hamb1y/localmodelhub/issues"

[tool.setuptools.packages.find]
include = ["lmh", "lmh.*"]
namespaces = false
